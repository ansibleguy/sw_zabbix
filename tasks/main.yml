---

- name: Zabbix | Checking config
  ansible.builtin.assert:
    that:
      - zabbix is defined
      - ZABBIX_CNF.version in ZABBIX_CNF.release
      - not ZABBIX_CNF.manage.server | bool or ZABBIX_CNF.server.nginx.domain is defined
      - ZABBIX_CNF.version is version('6.0', '>=')
      - not ZABBIX_CNF.manage.agent1 or ZABBIX_CNF.agent1.settings.Server | default(none, true) is not none or ZABBIX_CNF.agent1.settings.ServerActive | default(none, true) is not none
      - not ZABBIX_CNF.manage.agent2 or ZABBIX_CNF.agent2.settings.Server | default(none, true) is not none or ZABBIX_CNF.agent2.settings.ServerActive | default(none, true) is not none
  tags: always

- name: Zabbix | Processing debian config
  ansible.builtin.import_tasks: debian/main.yml
  when: "ansible_distribution|lower in ['debian', 'ubuntu']"
